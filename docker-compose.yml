# Optional. Usage: docker compose up --build   then open http://localhost:8000
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data      # reuse history survives restarts
      - ./models:/app/models  # optional trained classifier
